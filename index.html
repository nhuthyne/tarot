<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Sinh Thái Tâm Linh Pro - Bảo Mật</title>
    <!-- Thư viện html2canvas để hỗ trợ xuất ảnh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.15);
            --primary: #a78bfa;
            --primary-hover: #c084fc;
            --secondary: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --danger: #f87171;
        }

        /* KHÓA BÔI ĐEN VÀ KÉO THẢ (ANTI-COPY/DRAG) */
        * { 
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; 
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #312e81 0%, var(--bg-color) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
            transition: filter 0.2s ease;
        }

        /* LÀM MỜ KHI IN (ANTI-PRINT) */
        @media print {
            body { display: none !important; }
        }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { 
            font-size: 2.5rem; 
            background: linear-gradient(to right, var(--secondary), var(--primary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 0.5rem; 
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .controls { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover:not(:disabled) { 
            background: rgba(167, 139, 250, 0.2); 
            border-color: var(--primary); 
            transform: translateY(-2px); 
            box-shadow: 0 10px 15px -3px rgba(167, 139, 250, 0.2); 
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-back { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-back:hover { background: var(--danger); color: white; border-color: var(--danger); box-shadow: 0 10px 15px -3px rgba(248, 113, 113, 0.3); }

        .btn-export { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; }
        .btn-export:hover { background: #10b981; color: white; border-color: #10b981; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); }

        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- XUẤT ẢNH & WATERMARK --- */
        .export-area {
            position: relative;
            padding: 2rem;
            border-radius: 16px;
            background: var(--bg-color); /* Nền đặc để xuất ảnh không bị lỗi trong suốt */
        }

        .watermark-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 5vw, 4rem);
            color: rgba(255, 255, 255, 0.15); /* Chữ mờ */
            font-weight: 800;
            pointer-events: none;
            z-index: 9999;
            transform: rotate(-30deg);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- TAROT STYLES --- */
        .tarot-wrapper { display: flex; justify-content: center; }
        .grid-1 { display: flex; justify-content: center; }
        .grid-1 .tarot-card { width: 260px; }
        .grid-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; max-width: 800px; }
        .grid-6 .tarot-card { width: 180px; }
        .grid-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; max-width: 900px; }
        .grid-12 .tarot-card { width: 150px; }

        .tarot-card {
            perspective: 1000px;
            cursor: pointer;
            aspect-ratio: 2 / 3.2;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-radius: 12px;
        }

        .tarot-card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .card-back {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            background-image: repeating-linear-gradient(45deg, rgba(167, 139, 250, 0.1) 0px, rgba(167, 139, 250, 0.1) 10px, transparent 10px, transparent 20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-back::after { content: '✧'; font-size: 3rem; color: rgba(255,255,255,0.2); }

        .card-front {
            transform: rotateY(180deg);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-front img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
        .img-reversed { transform: rotateZ(180deg); }
        
        /* GIAO DIỆN ĐỒ HỌA DỰ PHÒNG */
        .card-fallback {
            display: none; 
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            border: 1px solid #3b82f6;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        
        .card-fallback::before { 
            content: ''; 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 15px 15px;
            z-index: 0;
        }

        .fallback-symbol {
            position: relative;
            width: 60px; height: 60px;
            margin-bottom: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            z-index: 1;
        }

        .fallback-shape1, .fallback-shape2 {
            position: absolute; width: 100%; height: 100%;
            border: 1px solid rgba(212, 175, 55, 0.4);
            transition: transform 0.3s;
        }
        .fallback-shape1 { transform: rotate(45deg); }
        .fallback-shape2 { transform: rotate(15deg); }
        
        .fallback-circle {
            position: absolute; width: 85%; height: 85%;
            border: 1px dashed rgba(212, 175, 55, 0.8); 
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }
        
        .fallback-moon {
            position: absolute; width: 26px; height: 26px;
            border-radius: 50%;
            box-shadow: inset -4px -4px 0 0 #d4af37;
            transform: rotate(-45deg);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .fallback-name { 
            font-family: 'Georgia', serif; font-weight: bold; font-size: 1.05rem; 
            line-height: 1.3; text-align: center; color: #f8fafc; z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-label {
            text-align: center; font-size: 0.95rem; font-weight: 600;
            opacity: 0; transition: opacity 0.5s; margin-top: 0.5rem; color: var(--primary);
        }
        .tarot-card.flipped .card-label { opacity: 1; }
        .text-nguoc { color: var(--danger); }

        /* --- I CHING STYLES --- */
        .iching-area { display: flex; flex-direction: column; align-items: center; gap: 2rem; }
        .lines-container { display: flex; flex-direction: column-reverse; gap: 0.6rem; width: 280px; margin: 0 auto; }

        .hao-row { 
            display: flex; align-items: center; justify-content: space-between; gap: 1rem; 
            opacity: 0; transform: translateY(10px); transition: all 0.5s ease;
        }
        .hao-row.show { opacity: 1; transform: translateY(0); }
        
        .hao-label { width: 50px; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .hao { flex-grow: 1; height: 26px; display: flex; align-items: center; justify-content: center; }

        .yang { width: 100%; height: 100%; background: linear-gradient(to right, #f8fafc, #cbd5e1); border-radius: 4px; box-shadow: 0 2px 10px rgba(255,255,255,0.1); }
        .yin { width: 100%; height: 100%; display: flex; justify-content: space-between; }
        .yin::before, .yin::after { content: ''; width: 46%; height: 100%; background: linear-gradient(to right, #f8fafc, #cbd5e1); border-radius: 4px; box-shadow: 0 2px 10px rgba(255,255,255,0.1); }
        
        .hao-status { width: 40px; color: var(--gold); font-weight: bold; font-size: 1rem; text-align: center; }
        .hao-status span { display: inline-block; background: rgba(251, 191, 36, 0.2); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }

        .results { display: flex; gap: 1.5rem; justify-content: center; width: 100%; margin-top: 1rem; flex-wrap: wrap; }
        .hexagram-result { 
            background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 16px; 
            text-align: center; flex: 1; min-width: 250px; 
            border: 1px solid var(--border-color); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease forwards;
        }
        .hexagram-title { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;}
        .hexagram-name { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-bottom: 1rem; }

    </style>
</head>
<body>

    <header>
        <h1>Trạm Dừng Chân Tâm Linh</h1>
        <p style="color: var(--text-muted)">Thấu hiểu năng lượng vũ trụ qua Tarot & Kinh Dịch</p>
    </header>

    <div class="container">
        <!-- Main Menu -->
        <div id="main-menu" class="section active">
            <div class="controls">
                <button onclick="switchSection('tarot-section')">🃏 Trải Bài Tarot</button>
                <button onclick="switchSection('iching-section')">☯️ Gieo Quẻ Kinh Dịch</button>
            </div>
        </div>

        <!-- Tarot Section -->
        <div id="tarot-section" class="section">
            <div class="controls">
                <button class="btn-back" onclick="switchSection('main-menu')">← Trở về</button>
                <button onclick="drawTarot(1)">Trải 1 lá</button>
                <button onclick="drawTarot(6)">Trải 6 lá</button>
                <button onclick="drawTarot(12)">Trải 12 lá</button>
                <button id="btn-export-tarot" class="btn-export" style="display: none;" onclick="exportImage('tarot-export-area', 'Codelo-Tarot-Spread')">📸 Lưu Ảnh Chuyên Nghiệp</button>
            </div>
            <!-- Gói gọn khu vực cần xuất ảnh -->
            <div id="tarot-export-area" class="export-area">
                <div class="tarot-wrapper">
                    <div id="tarot-result"></div>
                </div>
            </div>
        </div>

        <!-- I Ching Section -->
        <div id="iching-section" class="section">
            <div class="controls">
                <button class="btn-back" onclick="switchSection('main-menu')">← Trở về</button>
                <button id="btn-gieo-tu-dong" onclick="autoToss()">⚡ Gieo Quẻ Tự Động</button>
                <button onclick="resetIching()">🔄 Xóa làm lại</button>
                <button id="btn-export-iching" class="btn-export" style="display: none;" onclick="exportImage('iching-export-area', 'Codelo-IChing-Result')">📸 Lưu Ảnh Chuyên Nghiệp</button>
            </div>
            
            <!-- Gói gọn khu vực cần xuất ảnh -->
            <div id="iching-export-area" class="export-area">
                <div class="iching-area">
                    <div id="lines-display" class="lines-container"></div>
                    <div id="iching-result" class="results" style="display: none;">
                        <div class="hexagram-result">
                            <div class="hexagram-title">Quẻ Chủ (Hiện Tại)</div>
                            <div id="que-chu-name" class="hexagram-name"></div>
                            <div id="que-chu-detail" style="color: var(--text-main)"></div>
                        </div>
                        <div class="hexagram-result" id="que-bien-container" style="display: none;">
                            <div class="hexagram-title">Quẻ Biến (Tương Lai)</div>
                            <div id="que-bien-name" class="hexagram-name"></div>
                            <div id="que-bien-detail" style="color: var(--text-main)"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === HỆ THỐNG BẢO MẬT (CHỐNG SOI CODE & CHỤP MÀN HÌNH BẰNG TỔ HỢP PHÍM) ===
        // Chặn chuột phải
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Chặn phím tắt mở Developer Tools
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
            // Thử bắt PrintScreen (Dù hệ điều hành có thể ưu tiên thu nhận trước)
            if(e.key === 'PrintScreen' || e.keyCode == 44) {
                navigator.clipboard.writeText(''); // Xóa bộ nhớ đệm
                document.body.style.filter = 'blur(20px)';
                setTimeout(() => { document.body.style.filter = 'none'; }, 2000);
            }
        };

        // Làm mờ trang khi cửa sổ bị mất tiêu điểm (Anti-Snipping Tool)
        window.addEventListener('blur', () => {
            document.body.style.filter = 'blur(20px)';
        });
        window.addEventListener('focus', () => {
            document.body.style.filter = 'none';
        });

        // === HỆ THỐNG ĐIỀU HƯỚNG ===
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            if(sectionId === 'iching-section') resetIching();
            if(sectionId === 'tarot-section') {
                document.getElementById('tarot-result').innerHTML = '';
                document.getElementById('btn-export-tarot').style.display = 'none';
            }
        }

        // === LOGIC XUẤT ẢNH CHUYÊN NGHIỆP CÓ WATERMARK ===
        function exportImage(containerId, fileName) {
            const container = document.getElementById(containerId);
            
            // Tạo Watermark
            const watermark = document.createElement('div');
            watermark.className = 'watermark-overlay';
            watermark.innerText = 'Created by Bao Hy - Codelo';
            container.appendChild(watermark);

            // Tạm thời sửa style để xuất ảnh đẹp hơn
            const oldBg = container.style.background;
            container.style.background = '#0f172a'; // Đổ nền đặc chống lỗi trong suốt
            
            // Tiến hành chụp khung hình
            html2canvas(container, {
                useCORS: true, // Cho phép load ảnh từ CDN chéo domain
                scale: 2,      // Xuất ảnh sắc nét (HD)
                backgroundColor: '#0f172a'
            }).then(canvas => {
                // Xóa Watermark & Trả lại giao diện
                container.removeChild(watermark);
                container.style.background = oldBg;
                
                // Tự động tải xuống
                const link = document.createElement('a');
                link.download = fileName + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                container.removeChild(watermark);
                container.style.background = oldBg;
                alert("Xuất ảnh thất bại. Có thể do kết nối mạng yếu lúc tải hình!");
            });
        }

        // === LOGIC TAROT ===
        const majorNames = ["The Fool", "The Magician", "The High Priestess", "The Empress", "The Emperor", "The Hierophant", "The Lovers", "The Chariot", "Strength", "The Hermit", "Wheel of Fortune", "Justice", "The Hanged Man", "Death", "Temperance", "The Devil", "The Tower", "The Star", "The Moon", "The Sun", "Judgement", "The World"];
        const suits = [{code: 'Wands', imgCode: 'wa'}, {code: 'Cups', imgCode: 'cu'}, {code: 'Swords', imgCode: 'sw'}, {code: 'Pentacles', imgCode: 'pe'}];
        const ranks = ["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"];
        
        const proxy = "https://wsrv.nl/?url=";
        let tarotDeck = [];
        
        majorNames.forEach((name, i) => {
            let numStr = i < 10 ? '0' + i : i;
            tarotDeck.push({ name: name, img: `${proxy}sacred-texts.com/tarot/pkt/img/ar${numStr}.jpg` });
        });
        
        suits.forEach(suit => {
            ranks.forEach((rank, i) => {
                let suffix = '';
                if (rank === "Ace") suffix = 'ac';
                else if (rank === "Page") suffix = 'pa';
                else if (rank === "Knight") suffix = 'kn';
                else if (rank === "Queen") suffix = 'qu';
                else if (rank === "King") suffix = 'ki';
                else {
                    let num = i + 1;
                    suffix = num < 10 ? '0' + num : num.toString();
                }
                tarotDeck.push({ name: `${rank} of<br>${suit.code}`, img: `${proxy}sacred-texts.com/tarot/pkt/img/${suit.imgCode}${suffix}.jpg` });
            });
        });

        function drawTarot(numCards) {
            document.getElementById('btn-export-tarot').style.display = 'none'; // Ẩn nút lưu ảnh khi mới lật
            const resultDiv = document.getElementById('tarot-result');
            resultDiv.innerHTML = '';
            resultDiv.className = `grid-${numCards}`;
            
            let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, numCards);

            selected.forEach((card, index) => {
                const isUpright = Math.random() > 0.5;
                const stateText = isUpright ? 'Xuôi' : 'Ngược';
                const labelClass = isUpright ? '' : 'text-nguoc';
                const imgClass = isUpright ? '' : 'img-reversed';

                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'tarot-card';
                cardWrapper.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <img src="${card.img}" class="${imgClass}" alt="${card.name}" crossorigin="anonymous"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="card-fallback">
                                <div class="fallback-symbol ${imgClass}">
                                    <div class="fallback-shape1"></div>
                                    <div class="fallback-shape2"></div>
                                    <div class="fallback-circle"></div>
                                    <div class="fallback-moon"></div>
                                </div>
                                <div class="fallback-name ${imgClass}">${card.name}</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-label ${labelClass}">${card.name.replace('<br>', ' ')}<br>(${stateText})</div>
                `;
                
                cardWrapper.onclick = () => cardWrapper.classList.toggle('flipped');
                resultDiv.appendChild(cardWrapper);

                // Tự động lật bài
                setTimeout(() => {
                    cardWrapper.classList.add('flipped');
                }, 200 + (index * 150));
            });

            // Hiện nút lưu ảnh sau khi lật bài xong
            setTimeout(() => {
                document.getElementById('btn-export-tarot').style.display = 'flex';
            }, 200 + (numCards * 150) + 500);
        }

        // === LOGIC KINH DỊCH ===
        const elements = { 7: "Thiên (Trời)", 3: "Trạch (Đầm)", 5: "Hỏa (Lửa)", 1: "Lôi (Sấm)", 6: "Phong (Gió)", 2: "Thủy (Nước)", 4: "Sơn (Núi)", 0: "Địa (Đất)" };
        const elementPrefix = { 7: "Thiên", 3: "Trạch", 5: "Hỏa", 1: "Lôi", 6: "Phong", 2: "Thủy", 4: "Sơn", 0: "Địa" };

        let currentLines = [];

        function autoToss() {
            resetIching();
            const btnGieo = document.getElementById('btn-gieo-tu-dong');
            btnGieo.disabled = true;
            btnGieo.innerText = "Đang gieo...";

            for (let i = 0; i < 6; i++) {
                let coin1 = Math.random() > 0.5 ? 2 : 3;
                let coin2 = Math.random() > 0.5 ? 2 : 3;
                let coin3 = Math.random() > 0.5 ? 2 : 3;
                currentLines.push(coin1 + coin2 + coin3);
            }
            renderIchingLinesAuto();
        }

        function renderIchingLinesAuto() {
            const container = document.getElementById('lines-display');
            container.innerHTML = '';
            
            currentLines.forEach((val, index) => {
                let isYang = (val === 7 || val === 9);
                let isMoving = (val === 6 || val === 9);
                let textMoving = val === 6 ? "Động Âm" : (val === 9 ? "Động Dương" : "");

                const row = document.createElement('div');
                row.className = 'hao-row';
                row.innerHTML = `
                    <div class="hao-label">Hào ${index + 1}</div>
                    <div class="hao">
                        <div class="${isYang ? 'yang' : 'yin'}"></div>
                    </div>
                    <div class="hao-status">${isMoving ? `<span>${textMoving}</span>` : ''}</div>
                `;
                container.prepend(row);

                setTimeout(() => { row.classList.add('show'); }, index * 200);
            });

            setTimeout(() => {
                calculateHexagrams();
                const btnGieo = document.getElementById('btn-gieo-tu-dong');
                btnGieo.disabled = false;
                btnGieo.innerText = "⚡ Gieo Quẻ Tự Động";
                document.getElementById('btn-export-iching').style.display = 'flex'; // Hiện nút xuất ảnh
            }, 6 * 200 + 300);
        }

        function calculateHexagrams() {
            let primaryBinary = [], secondaryBinary = [], hasMovingLine = false;

            currentLines.forEach(val => {
                if (val === 7) { primaryBinary.push(1); secondaryBinary.push(1); }
                else if (val === 8) { primaryBinary.push(0); secondaryBinary.push(0); }
                else if (val === 9) { primaryBinary.push(1); secondaryBinary.push(0); hasMovingLine = true; }
                else if (val === 6) { primaryBinary.push(0); secondaryBinary.push(1); hasMovingLine = true; }
            });

            const getTrigramIndex = (binArr, start) => (binArr[start]*1) + (binArr[start+1]*2) + (binArr[start+2]*4);

            const pLower = getTrigramIndex(primaryBinary, 0);
            const pUpper = getTrigramIndex(primaryBinary, 3);
            const pName = (pUpper === pLower) ? `Thuần ${elementPrefix[pUpper]}` : `${elementPrefix[pUpper]} ${elementPrefix[pLower]}`;
            
            document.getElementById('que-chu-name').innerText = pName;
            document.getElementById('que-chu-detail').innerHTML = `Thượng: <b>${elements[pUpper]}</b> <br> Hạ: <b>${elements[pLower]}</b>`;
            document.getElementById('iching-result').style.display = 'flex';

            const queBienContainer = document.getElementById('que-bien-container');
            if (hasMovingLine) {
                const sLower = getTrigramIndex(secondaryBinary, 0);
                const sUpper = getTrigramIndex(secondaryBinary, 3);
                const sName = (sUpper === sLower) ? `Thuần ${elementPrefix[sUpper]}` : `${elementPrefix[sUpper]} ${elementPrefix[sLower]}`;
                
                document.getElementById('que-bien-name').innerText = sName;
                document.getElementById('que-bien-detail').innerHTML = `Thượng: <b>${elements[sUpper]}</b> <br> Hạ: <b>${elements[sLower]}</b>`;
                queBienContainer.style.display = 'block';
            } else {
                queBienContainer.style.display = 'none';
            }
        }

        function resetIching() {
            currentLines = [];
            document.getElementById('lines-display').innerHTML = '';
            document.getElementById('iching-result').style.display = 'none';
            document.getElementById('btn-export-iching').style.display = 'none';
        }
    </script>
</body>
</html>
